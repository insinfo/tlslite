name: tlslite
version: 1.0.0
description: >-
  Pure-Dart TLS 1.0-1.3 client/server (port of tlslite-ng) with X.509 chain
  and host name validation, custom transports and optional OpenSSL FFI sockets.
repository: https://github.com/insinfo/tlslite
topics:
  - tls
  - ssl
  - crypto
  - x509
  - security

environment:
  sdk: '^3.6.0'

dev_dependencies:
  # Referências independentes para os testes das implementações próprias.
  crypto: ^3.0.6
  pointycastle: ^4.0.0
  benchmark_harness: ^2.3.1
  collection: ^1.18.0
  convert: ^3.1.2
  ffigen: ^19.0.0
  hex: ^0.2.0
  test: ^1.26.3
